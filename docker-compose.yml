services:
  mysql:
    image: mysql:8.4
    container_name: clario-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clario
      MYSQL_USER: clario
      MYSQL_PASSWORD: clario
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - clario_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uclario", "-pclario"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  clario_mysql_data:

